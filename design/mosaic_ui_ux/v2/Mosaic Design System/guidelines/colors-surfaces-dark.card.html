nd;gap:3px"><div class="n" style="color:var(--mos-text-strong)">Hover</div><div class="m" style="color:var(--mos-text-muted);opacity:.8">surface-hover</div></div><div style="flex:1;height:84px;padding:10px;border-radius:6px;background:var(--mos-surface-selected);border:1px solid var(--mos-border-subtle);box-shadow:var(--mos-highlight-top);display:flex;flex-direction:column;justify-content:flex-end;gap:3px"><div class="n" style="color:var(--mos-text-strong)">Selected</div><div class="m" style="color:var(--mos-text-muted);opacity:.8">surface-selected</div></div><div style="flex:1;height:84px;padding:10px;border-radius:6px;background:var(--mos-surface-inverse);border:1px solid var(--mos-border-subtle);box-shadow:var(--mos-highlight-top);display:flex;flex-direction:column;justify-content:flex-end;gap:3px"><div class="n" style="color:var(--mos-text-inverse)">Inverse</div><div class="m" style="color:var(--mos-text-inverse);opacity:.8">surface-inverse</div></div></div></body></html>
