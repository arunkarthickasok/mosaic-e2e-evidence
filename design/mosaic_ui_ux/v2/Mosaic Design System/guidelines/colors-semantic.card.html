<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;font-family:var(--mos-font-sans);color:var(--mos-text-default);background:var(--mos-surface-chrome)}.w{padding:18px 20px;display:flex;gap:10px;align-items:stretch}.m{font:500 10.5px/1.3 var(--mos-font-mono);color:var(--mos-text-muted)}.n{font:600 12px/1.3 var(--mos-font-sans);color:var(--mos-text-strong)}</style></head><body class="mosaic"><div class="w" ><div style="flex:1;padding:12px;border:1px solid var(--mos-state-ready-border);background:var(--mos-state-ready-bg);border-radius:6px;display:flex;flex-direction:column;gap:6px"><div style="display:flex;align-items:center;gap:6px;color:var(--mos-state-ready-fg);font:600 13px var(--mos-font-sans)"><span class="mos-icon" style="width:14px;height:14px;-webkit-mask-image:url(https://unpkg.com/lucide-static@0.460.0/icons/check.svg);mask-image:url(https://unpkg.com/lucide-static@0.460.0/icons/check.svg)"></span>Ready</div><div class="m" style="color:var(--mos-text-muted)">--mos-state-ready-*</div><div style="font-size:11px;color:var(--mos-text-muted)">Semantic only</div></div><div style="flex:1;padding:12px;border:1px solid var(--mos-state-attention-border);background:var(--mos-state-attention-bg);border-radius:6px;display:flex;flex-direction:column;gap:6px"><div style="display:flex;align-items:center;gap:6px;color:var(--mos-state-attention-fg);font:600 13px var(--mos-font-sans)"><span class="mos-icon" style="width:14px;height:14px;-webkit-mask-image:url(https://unpkg.com/lucide-static@0.460.0/icons/triangle-alert.svg);mask-image:url(https://unpkg.com/lucide-static@0.460.0/icons/triangle-alert.svg)"></span>Attention</div><div class="m" style="color:var(--mos-text-muted)">--mos-state-attention-*</div><div style="font-size:11px;color:var(--mos-text-muted)">Named field + reason</div></div><div style="flex:1;padding:12px;border:1px solid var(--mos-state-blocked-border);background:var(--mos-state-blocked-bg);border-radius:6px;display:flex;flex-direction:column;gap:6px"><div style="display:flex;align-items:center;gap:6px;color:var(--mos-state-blocked-fg);font:600 13px var(--mos-font-sans)"><span class="mos-icon" style="width:14px;height:14px;-webkit-mask-image:url(https://unpkg.com/lucide-static@0.460.0/icons/ban.svg);mask-image:url(https://unpkg.com/lucide-static@0.460.0/icons/ban.svg)"></span>Blocked</div><div class="m" style="color:var(--mos-text-muted)">--mos-state-blocked-*</div><div style="font-size:11px;color:var(--mos-text-muted)">Errors, refused</div></div><div style="flex:1;padding:12px;border:1px solid var(--mos-state-data-border);background:var(--mos-state-data-bg);border-radius:6px;display:flex;flex-direction:column;gap:6px"><div style="display:flex;align-items:center;gap:6px;color:var(--mos-state-data-fg);font:600 13px var(--mos-font-sans)"><span class="mos-icon" style="width:14px;height:14px;-webkit-mask-image:url(https://unpkg.com/lucide-static@0.460.0/icons/database.svg);mask-image:url(https://unpkg.com/lucide-static@0.460.0/icons/database.svg)"></span>Data</div><div class="m" style="color:var(--mos-text-muted)">--mos-state-data-*</div><div style="font-size:11px;color:var(--mos-text-muted)">Binding, zones</div></div><div style="flex:1;padding:12px;border:1px solid var(--mos-state-neutral-border);background:var(--mos-state-neutral-bg);border-radius:6px;display:flex;flex-direction:column;gap:6px"><div style="display:flex;align-items:center;gap:6px;color:var(--mos-state-neutral-fg);font:600 13px var(--mos-font-sans)"><span class="mos-icon" style="width:14px;height:14px;-webkit-mask-image:url(https://unpkg.com/lucide-static@0.460.0/icons/circle.svg);mask-image:url(https://unpkg.com/lucide-static@0.460.0/icons/circle.svg)"></span>Neutral</div><div class="m" style="color:var(--mos-text-muted)">--mos-state-neutral-*</div><div style="font-size:11px;color:var(--mos-text-muted)">Info, read-only</div></div></div></body></html>
