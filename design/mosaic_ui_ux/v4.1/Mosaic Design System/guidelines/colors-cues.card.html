<!-- @dsCard group="Colors" viewport="700x130" name="Structure cues" subtitle="Indigo = structure/data, teal = selection, amber = required" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;font-family:var(--mos-font-sans);color:var(--mos-text-default);background:var(--mos-surface-chrome)}.w{padding:18px 20px;display:flex;gap:10px;align-items:stretch}.m{font:500 12px/1.3 var(--mos-font-mono);color:var(--mos-text-muted)}.n{font:600 12px/1.3 var(--mos-font-sans);color:var(--mos-text-strong)}</style></head><body class="mosaic"><div class="w" style="gap:14px">
<div style="flex:1;border:1px dashed var(--mos-slot-line);border-radius:4px;padding:26px 10px 10px;position:relative"><span class="m" style="position:absolute;top:7px;left:8px;color:var(--mos-state-data-fg)">ZONE · IDLE</span><div style="height:34px;background:var(--mos-slot-fill);border-radius:3px"></div></div>
<div style="flex:1;border:1px solid var(--mos-slot-line);background:var(--mos-slot-fill);border-radius:4px;padding:26px 10px 10px;position:relative"><span class="m" style="position:absolute;top:7px;left:8px;color:var(--mos-state-data-fg)">ZONE · DRAG-OVER</span><div class="mos-drop-line" style="margin-top:14px"></div></div>
<div style="flex:1;border:1px dashed var(--mos-slot-required-line);border-radius:4px;padding:26px 10px 10px;position:relative"><span class="m" style="position:absolute;top:7px;left:8px;color:var(--mos-state-attention-fg)">ZONE · REQUIRED*</span><div style="height:34px;background:var(--mos-slot-fill);border-radius:3px"></div></div>
<div style="flex:1;border:1px solid var(--mos-state-blocked-fg);background:var(--mos-state-blocked-bg);border-radius:4px;padding:26px 10px 10px;position:relative"><span class="m" style="position:absolute;top:7px;left:8px;color:var(--mos-state-blocked-fg)">ZONE · REFUSED</span><div style="height:34px"></div></div></div></body></html>
